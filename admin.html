<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard · Budaya Nusantara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== SEMUA CSS SAMA SEPERTI admin-22.html ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Plus Jakarta Sans',sans-serif; background:#0d0d0d; color:#E8DDD0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        #loginPage { width:100%; max-width:400px; padding:32px 28px; background:rgba(30,30,30,0.92); border-radius:20px; border:1px solid rgba(184,137,58,0.2); box-shadow:0 8px 40px rgba(0,0,0,0.6); text-align:center; }
        #loginPage h1 { font-family:'Playfair Display',serif; font-size:2rem; color:#D4A853; margin-bottom:4px; }
        #loginPage p { color:#A0A0A0; font-size:0.9rem; margin-bottom:24px; }
        #loginPage .form-group { margin-bottom:16px; text-align:left; }
        #loginPage label { font-size:0.75rem; font-weight:600; color:#A0A0A0; text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:4px; }
        #loginPage input { width:100%; padding:12px 16px; border-radius:10px; border:1px solid rgba(184,137,58,0.15); background:#1A1A1A; color:#E8DDD0; font-size:0.95rem; }
        #loginPage input:focus { outline:none; border-color:#D4A853; box-shadow:0 0 0 3px rgba(184,137,58,0.15); }
        #loginPage .btn-login { width:100%; padding:12px; background:linear-gradient(135deg,#B8893A,#D4A853); color:#fff; font-weight:700; font-size:1rem; border:none; border-radius:10px; cursor:pointer; transition:all 0.3s; }
        #loginPage .btn-login:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(184,137,58,0.4); }
        #loginError { color:#EF5350; font-size:0.85rem; margin-top:12px; display:none; }
        #adminPage { display:none; width:100%; min-height:100vh; background:#0d0d0d; }
        #adminPage.active { display:flex; }
        .sidebar { width:250px; min-height:100vh; background:rgba(20,20,20,0.95); backdrop-filter:blur(8px); border-right:1px solid rgba(184,137,58,0.08); padding:20px 12px; display:flex; flex-direction:column; flex-shrink:0; position:sticky; top:0; height:100vh; overflow-y:auto; }
        .sidebar .brand { font-family:'Playfair Display',serif; font-size:1.3rem; font-weight:700; color:#D4A853; padding:0 12px 16px; border-bottom:1px solid rgba(184,137,58,0.08); margin-bottom:12px; display:flex; align-items:center; gap:10px; }
        .sidebar .brand i { font-size:1.5rem; }
        .sidebar .menu-label { font-size:0.6rem; text-transform:uppercase; letter-spacing:1px; color:#707070; padding:12px 12px 6px; font-weight:700; }
        .sidebar .menu-item { display:flex; align-items:center; gap:12px; padding:9px 14px; border-radius:10px; font-weight:500; font-size:0.82rem; color:#B0B0B0; cursor:pointer; transition:all 0.2s; margin-bottom:2px; border:none; background:transparent; width:100%; text-align:left; font-family:'Plus Jakarta Sans',sans-serif; }
        .sidebar .menu-item i { width:20px; color:#707070; transition:color 0.2s; }
        .sidebar .menu-item:hover { background:rgba(184,137,58,0.08); color:#E8DDD0; }
        .sidebar .menu-item:hover i { color:#D4A853; }
        .sidebar .menu-item.active { background:rgba(184,137,58,0.15); color:#D4A853; }
        .sidebar .menu-item.active i { color:#D4A853; }
        .sidebar .logout-wrap { margin-top:auto; border-top:1px solid rgba(184,137,58,0.08); padding-top:14px; }
        .sidebar .logout-wrap .menu-item { color:#EF5350; }
        .sidebar .logout-wrap .menu-item i { color:#EF5350; }
        .sidebar .logout-wrap .menu-item:hover { background:rgba(239,83,80,0.1); }
        .main-content { flex:1; padding:28px 36px; overflow-y:auto; max-height:100vh; }
        .main-content .page-title { font-family:'Playfair Display',serif; font-size:1.8rem; font-weight:700; color:#D4A853; margin-bottom:4px; }
        .main-content .page-sub { color:#A0A0A0; font-size:0.85rem; margin-bottom:20px; }
        .form-card { background:rgba(30,30,30,0.85); border-radius:14px; padding:22px 26px; border:1px solid rgba(184,137,58,0.08); margin-bottom:24px; }
        .form-card .form-title { font-weight:700; font-size:1rem; color:#D4A853; margin-bottom:14px; }
        .form-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
        .form-group { display:flex; flex-direction:column; gap:3px; }
        .form-group label { font-size:0.7rem; font-weight:600; color:#A0A0A0; text-transform:uppercase; letter-spacing:0.5px; }
        .form-group input, .form-group textarea, .form-group select { padding:9px 12px; border-radius:8px; border:1px solid rgba(184,137,58,0.12); background:#1A1A1A; color:#E8DDD0; font-size:0.85rem; transition:border 0.3s; font-family:'Plus Jakarta Sans',sans-serif; width:100%; }
        .form-group textarea { resize:vertical; min-height:80px; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline:none; border-color:#D4A853; }
        .form-group input:disabled { opacity:0.5; cursor:not-allowed; }

        /* ===== FILE UPLOAD ===== */
        .file-upload-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .file-upload-wrapper .upload-area {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .file-upload-wrapper input[type="file"] {
            display: none;
        }
        .file-upload-wrapper .file-count {
            font-size: 0.8rem;
            color: #A0A0A0;
            padding: 6px 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            border: 1px solid rgba(184,137,58,0.08);
        }
        .file-upload-wrapper .file-count.has-file {
            color: #D4A853;
            border-color: rgba(184,137,58,0.3);
        }
        .btn-upload {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.75rem;
            border: 1px solid rgba(184,137,58,0.2);
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: rgba(184,137,58,0.1);
            color: #D4A853;
        }
        .btn-upload:hover {
            background: rgba(184,137,58,0.2);
            border-color: #B8893A;
        }
        .btn-upload i { font-size: 0.8rem; }

        .file-grid-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            margin-top: 10px;
            max-height: 160px;
            overflow-y: auto;
            padding: 4px;
        }
        .file-grid-preview .preview-item {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(184,137,58,0.1);
            aspect-ratio: 1;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 4px;
            text-align: center;
        }
        .file-grid-preview .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .file-grid-preview .preview-item .file-icon {
            font-size: 1.8rem;
            color: #D4A853;
        }
        .file-grid-preview .preview-item .file-name {
            font-size: 0.5rem;
            color: #A0A0A0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
            margin-top: 2px;
        }
        .file-grid-preview .preview-item .remove-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(198,40,40,0.8);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 5;
        }
        .file-grid-preview .preview-item .remove-btn:hover {
            background: #C62828;
            transform: scale(1.1);
        }

        .form-actions { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
        .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 18px; border-radius:8px; font-weight:600; font-size:0.8rem; border:none; cursor:pointer; transition:all 0.3s; font-family:'Plus Jakarta Sans',sans-serif; }
        .btn-primary { background:linear-gradient(135deg,#B8893A,#D4A853); color:#fff; }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(184,137,58,0.3); }
        .btn-outline { background:transparent; color:#D4A853; border:1.5px solid #B8893A; }
        .btn-outline:hover { background:rgba(184,137,58,0.08); }
        .btn-danger { background:#C62828; color:#fff; }
        .btn-danger:hover { background:#B71C1C; }
        .btn-sm { padding:4px 10px; font-size:0.7rem; }

        .table-wrap { background:rgba(30,30,30,0.85); border-radius:14px; border:1px solid rgba(184,137,58,0.08); overflow:hidden; }
        .table-wrap .table-header { padding:12px 18px; background:rgba(184,137,58,0.04); border-bottom:1px solid rgba(184,137,58,0.06); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
        .table-wrap .table-header h4 { font-weight:600; color:#D4A853; font-size:0.95rem; }
        .table-wrap .table-header .count { font-size:0.75rem; color:#A0A0A0; }
        .table-wrap .table-header .count span { color:#D4A853; font-weight:700; }
        .table-scroll { overflow-x:auto; padding:0 4px 4px 4px; }
        table { width:100%; border-collapse:collapse; font-size:0.75rem; min-width:700px; }
        table th { padding:8px 10px; text-align:left; font-weight:700; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.5px; color:#A0A0A0; border-bottom:2px solid rgba(184,137,58,0.08); white-space:nowrap; }
        table td { padding:8px 10px; border-bottom:1px solid rgba(255,255,255,0.04); color:#E8DDD0; vertical-align:middle; }
        table tbody tr:hover { background:rgba(184,137,58,0.03); }
        table tbody tr { cursor:pointer; }
        .empty-state { text-align:center; padding:32px 16px; color:#707070; }
        .empty-state i { font-size:2.2rem; color:rgba(184,137,58,0.15); margin-bottom:6px; }
        .badge-status { display:inline-block; padding:2px 10px; border-radius:9999px; font-size:0.65rem; font-weight:600; }
        .badge-status.Ditetapkan { background:rgba(46,125,50,0.2); color:#66BB6A; }
        .badge-status.Belum { background:rgba(198,40,40,0.2); color:#EF5350; }
        .badge-status.Proses { background:rgba(255,193,7,0.2); color:#FFD54F; }
        .badge-status.Perhatian { background:rgba(255,152,0,0.2); color:#FFB74D; }
        .file-thumb { width:30px; height:30px; border-radius:4px; object-fit:cover; background:rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; }
        .file-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.6rem;
            font-weight: 600;
            background: rgba(184,137,58,0.12);
            color: #D4A853;
        }
        .file-badge i { font-size: 0.65rem; }

        @media (max-width:768px) {
            #adminPage.active { flex-direction:column; }
            .sidebar { width:100%; min-height:auto; height:auto; position:relative; padding:12px; border-right:none; border-bottom:1px solid rgba(184,137,58,0.08); }
            .sidebar .brand { font-size:1.1rem; padding-bottom:10px; margin-bottom:10px; }
            .sidebar .menu-item { padding:7px 10px; font-size:0.75rem; }
            .main-content { padding:16px; max-height:none; overflow-y:visible; }
            .main-content .page-title { font-size:1.4rem; }
            .form-grid { grid-template-columns:1fr 1fr; }
            .file-grid-preview { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); }
        }
        @media (max-width:480px) { .form-grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div id="loginPage">
        <h1><i class="fas fa-crown" style="color:#D4A853;"></i> Admin</h1>
        <p>Masuk ke dashboard pengelolaan budaya</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="admin" value="admin" />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" value="admin123" />
            </div>
            <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Masuk</button>
            <div id="loginError">Username atau password salah!</div>
        </form>
    </div>
    <div id="adminPage">
        <aside class="sidebar">
            <div class="brand"><i class="fas fa-crown"></i> Admin Panel</div>
            <div class="menu-label">Data Budaya</div>
            <button class="menu-item active" data-menu="tradisi_lisan"><i class="fas fa-microphone-alt"></i> Tradisi Lisan</button>
            <button class="menu-item" data-menu="manuskrip"><i class="fas fa-scroll"></i> Manuskrip</button>
            <button class="menu-item" data-menu="adat_istiadat"><i class="fas fa-hand-holding-heart"></i> Adat Istiadat</button>
            <button class="menu-item" data-menu="ritus"><i class="fas fa-fire"></i> Ritus</button>
            <button class="menu-item" data-menu="pengetahuan_tradisional"><i class="fas fa-tree"></i> Pengetahuan Tradisional</button>
            <button class="menu-item" data-menu="teknologi_tradisional"><i class="fas fa-cogs"></i> Teknologi Tradisional</button>
            <button class="menu-item" data-menu="seni"><i class="fas fa-palette"></i> Seni</button>
            <button class="menu-item" data-menu="bahasa"><i class="fas fa-language"></i> Bahasa</button>
            <button class="menu-item" data-menu="permainan_rakyat"><i class="fas fa-dice"></i> Permainan Rakyat</button>
            <button class="menu-item" data-menu="olahraga_tradisional"><i class="fas fa-running"></i> Olahraga Tradisional</button>
            <button class="menu-item" data-menu="cagar_budaya"><i class="fas fa-landmark"></i> Cagar Budaya</button>
            <button class="menu-item" data-menu="struktur"><i class="fas fa-sitemap"></i> Struktur</button>
            <!-- ===== MENU GALERI (TAMBAHAN) ===== -->
            <button class="menu-item" data-menu="galeri"><i class="fas fa-images"></i> Galeri</button>
            <div class="logout-wrap">
                <button class="menu-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>
        <main class="main-content" id="mainContent">
            <h2 class="page-title" id="pageTitle">Tradisi Lisan</h2>
            <p class="page-sub" id="pageSub">Kelola data Tradisi Lisan di Provinsi Banten</p>
            <div class="form-card">
                <div class="form-title" id="formTitle"><i class="fas fa-plus-circle"></i> Tambah Data</div>
                <form id="dataForm">
                    <div class="form-grid" id="formFields"></div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="btnSubmit"><i class="fas fa-save"></i> Simpan</button>
                        <button type="button" class="btn btn-outline" id="btnCancel" style="display:none;"><i class="fas fa-times"></i> Batal</button>
                        <button type="button" class="btn btn-danger btn-sm" id="btnDeleteAll" style="margin-left:auto;"><i class="fas fa-trash"></i> Hapus Semua</button>
                    </div>
                </form>
            </div>
            <div class="table-wrap">
                <div class="table-header">
                    <h4><i class="fas fa-list"></i> Daftar Data</h4>
                    <div class="count">Total: <span id="totalCount">0</span></div>
                </div>
                <div class="table-scroll">
                    <table>
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // ===== KONFIGURASI MENU =====
            const MENU_CONFIG = {
                tradisi_lisan: {
  label: 'Tradisi Lisan',
  fields: [
    { key: 'kabupaten', label: 'Kabupaten/Kota', type: 'text', required: true },
    { key: 'nama_objek', label: 'Nama Objek', type: 'text', required: true },
    { key: 'nama_tradisi', label: 'Nama Tradisi Lisan', type: 'text', required: true },
    { key: 'deskripsi', label: 'Deskripsi', type: 'textarea' },
    // ===== TAMBAHAN =====
    { key: 'keterangan', label: 'Keterangan', type: 'select', options: ['Aktif', 'Tidak Aktif'], required: true },
    // ===== AKHIR TAMBAHAN =====
    { key: 'audio', label: 'Upload Audio (MP3/WAV)', type: 'file', accept: 'audio/*' },
    { key: 'dokumen', label: 'Upload Dokumen (PDF/DOC)', type: 'file', multiple: true, accept: '.pdf,.doc,.docx' }
  ]
                },
                manuskrip: {
                    label: 'Manuskrip',
                    fields: [
                        { key: 'pemilik', label: 'Pemilik/Penyimpan', type: 'text', required: true },
                        { key: 'alamat', label: 'Alamat', type: 'text', required: true },
                        { key: 'jumlah', label: 'Jumlah Naskah', type: 'number', required: true },
                        { key: 'deskripsi', label: 'Deskripsi', type: 'textarea' },
                        { key: 'gambar_manuskrip', label: 'Upload Gambar (JPG/PNG)', type: 'file', multiple: true, accept: 'image/*' },
                        { key: 'dokumen', label: 'Upload Dokumen (PDF/DOC)', type: 'file', multiple: true, accept: '.pdf,.doc,.docx' }
                    ]
                },
                adat_istiadat: {
                    label: 'Adat Istiadat',
                    fields: [
                        { key: 'kabupaten', label: 'Kabupaten/Kota', type: 'text', required: true },
                        { key: 'nama_objek', label: 'Nama Objek', type: 'text', required: true },
                        { key: 'deskripsi', label: 'Deskripsi', type: 'textarea', required: true },
                        { key: 'gambar_adat', label: 'Upload Gambar (JPG/PNG)', type: 'file', multiple: true, accept: 'image/*' }
                    ]
                },
                ritus: {
                    label: 'Ritus',
                    fields: [
                        { key: 'umur', label: 'Umur / Tahun', type: 'number' },
                        { key: 'bulan', label: 'Bulan', type: 'number' },
                        { key: 'kondisi', label: 'Kondisi Anak', type: 'text' },
                        { key: 'priangan', label: 'Priangan', type: 'text' },
                        { key: 'banten', label: 'Banten', type: 'text' },
                        { key: 'mainan', label: 'Mainan', type: 'text' },
                        { key: 'syair', label: 'Syair', type: 'text' },
                        { key: 'deskripsi', label: 'Deskripsi', type: 'textarea' },
                        { key: 'gambar_ritus', label: 'Upload Gambar (JPG/PNG)', type: 'file', multiple: true, accept: 'image/*' }
                    ]
                },
                pengetahuan_tradisional: {
                    label: 'Pengetahuan Tradisional',
                    fields: [
                        { key: 'kabupaten', label: 'Kabupaten/Kota', type: 'text', required: true },
                        { key: 'nama_pengetahuan', label: 'Nama Pengetahuan Tradisional', type: 'text', required: true },
                        { key: 'deskripsi', label: 'Deskripsi', type: 'textarea' },
                        { key: 'gambar_pengetahuan', label: 'Upload Gambar (JPG/PNG)', type: 'file', multiple: true, accept: 'image/*' }
                    ]
                },
                teknologi_tradisional: {
                    label: 'Teknologi Tradisional',
                    fields: [
                        { key: 'no', label: 'No.', type: 'number' },
                        { key: 'bahasa_sunda', label: 'Bahasa Sunda (BANTEN)', type: 'text' },
                        { key: 'bahasa_jawa', label: 'Bahasa Jawa (BANTEN)', type: 'text' },
                        { key: 'deskripsi', label: 'Deskripsi', type: 'textarea' },
                        { key: 'gambar_teknologi', label: 'Upload Gambar (JPG/PNG)', type: 'file', multiple: true, accept: 'image/*' }
                    ]
                },
                seni: {
                    label: 'Seni',
                    fields: [
                        { key: 'nama_lembaga', label: 'NAMA LEMBAGA/SANGGAR/KOMUNITAS', type: 'text', required: true },
                        { key: 'ketua', label: 'KETUA/PEMIMPIN', type: 'text', required: true },
                        { key: 'jenis_seni', label: 'JENIS SENI', type: 'select', options: ['Seni Rupa', 'Seni Musik', 'Seni Teater', 'Seni Tari', 'Seni Media', 'Seni Film', 'Seni Sastra'], required: true },
                        { key: 'anggota', label: 'ANGGOTA (jumlah)', type: 'number', required: true },
                        { key: 'deskripsi', label: 'DESKRIPSI', type: 'textarea' },
                        { key: 'gambar_seni', label: 'Upload Gambar (JPG/PNG)', type: 'file', multiple: true, accept: 'image/*' },
                        { key: 'dokumen', label: 'Upload Dokumen (PDF/DOC)', type: 'file', multiple: true, accept: '.pdf,.doc,.docx' }
                    ]
                },
                bahasa: {
                    label: 'Bahasa',
                    fields: [
                        { key: 'kabupaten', label: 'Kabupaten/Kota', type: 'text', required: true },
                        { key: 'nama_bahasa', label: 'Nama Bahasa', type: 'text', required: true },
                        { key: 'berkembang', label: 'Berkembang', type: 'select', options: ['Ya', 'Kurang', 'Tidak'], required: true },
                        { key: 'deskripsi', label: 'Deskripsi', type: 'textarea' }
                    ]
                },
                permainan_rakyat: {
                    label: 'Permainan Rakyat',
                    fields: [
                        { key: 'kabupaten', label: 'Kabupaten/Kota', type: 'text', required: true },

            function createPlaceholderImage(text, bgColor, textColor) {
                const canvas = document.createElement('canvas');
                canvas.width = 400;
                canvas.height = 400;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = bgColor || '#2E5444';
                ctx.fillRect(0, 0, 400, 400);
                ctx.strokeStyle = '#B8893A';
                ctx.lineWidth = 4;
                ctx.strokeRect(10, 10, 380, 380);
                ctx.fillStyle = textColor || '#E8DDD0';
                ctx.font = 'bold 28px serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text || 'Galeri', 200, 200);
                ctx.font = '18px sans-serif';
                ctx.fillStyle = '#D4A853';
                ctx.fillText('Banten', 200, 250);
                return canvas.toDataURL('image/png');
            }

                    alert(`File "${file.name}" terlalu besar (${sizeMB}MB). Maksimal ${maxMB}MB.`);

            // ===== GET FORM VALUES =====
            function getFormValues(menu) {
                const config = MENU_CONFIG[menu];
                const values = {};
                config.fields.forEach(f => {
                    if (f.type === 'file') {
                        if (f.key === 'audio') {
                            values[f.key] = audioFile || '';
                        } else if (f.key === 'dokumen') {
                            values[f.key] = dokumenList.length > 0 ? dokumenList : [];
                        } else if (f.key === 'dokumen_cagar') {
                            values[f.key] = dokumenCagarList.length > 0 ? dokumenCagarList : [];
                        } else if (f.key === 'gambar_manuskrip') {
                            values[f.key] = gambarManuskripList.length > 0 ? gambarManuskripList : [];
                        } else if (f.key === 'gambar_cagar') {
                            values[f.key] = gambarCagarList.length > 0 ? gambarCagarList : [];
                        } else if (f.key === 'gambar_adat') {
                            values[f.key] = gambarAdatList.length > 0 ? gambarAdatList : [];
                        } else if (f.key === 'gambar_ritus') {
                            values[f.key] = gambarRitusList.length > 0 ? gambarRitusList : [];
                        } else if (f.key === 'gambar_pengetahuan') {
                            values[f.key] = gambarPengetahuanList.length > 0 ? gambarPengetahuanList : [];
                        } else if (f.key === 'gambar_teknologi') {
                            values[f.key] = gambarTeknologiList.length > 0 ? gambarTeknologiList : [];
                        } else if (f.key === 'gambar_permainan') {
                            values[f.key] = gambarPermainanList.length > 0 ? gambarPermainanList : [];
                        } else if (f.key === 'gambar_olahraga') {
                            values[f.key] = gambarOlahragaList.length > 0 ? gambarOlahragaList : [];
                        } else if (f.key === 'gambar_seni') {
                            values[f.key] = gambarSeniList.length > 0 ? gambarSeniList : [];
                        } else if (f.key === 'gambar') {
                            values[f.key] = gambarGaleriList.length > 0 ? gambarGaleriList : [];
                        } else {
                            values[f.key] = [];
                        }
                    } else {
                        const el = document.getElementById('field_' + f.key);
                        if (el) {
                            values[f.key] = el.value.trim();
                            if (f.type === 'number') values[f.key] = parseInt(values[f.key]) || 0;
                        }
                    }
                });

                // ===== KHUSUS UNTUK STRUKTUR: ubah textarea menjadi array =====
                if (menu === 'struktur') {
                    ['cagar_budaya', 'kesenian_bahasa', 'sejarah_tradisi'].forEach(key => {
                        const el = document.getElementById('field_' + key);
                        if (el) {
                            const raw = el.value.trim();
                            values[key] = raw ? raw.split('\n').map(s => s.trim()).filter(s => s) : [];
                        }
                    });
                }
                return values;
            }

            // ===== SET FORM VALUES =====
            function setFormValues(menu, data) {
                const config = MENU_CONFIG[menu];
                config.fields.forEach(f => {
                    if (f.type === 'file') {
                        if (f.key === 'audio') {
                            audioFile = data[f.key] || '';
                            const previewDiv = document.getElementById('audio_preview_audio');
                            const fileCount = document.getElementById('file_count_audio');
                            if (audioFile) {
                                if (previewDiv) {
                                    previewDiv.innerHTML = `<audio controls style="width:100%;"><source src="${audioFile}"></audio>`;
                                }
                                if (fileCount) {
                                    fileCount.textContent = 'Audio terupload';
                                    fileCount.classList.add('has-file');
                                }
                            } else {
                                if (previewDiv) previewDiv.innerHTML = '';
                                if (fileCount) {
                                    fileCount.textContent = 'Belum ada file';
                                    fileCount.classList.remove('has-file');
                                }
                            }
                        } else if (f.key === 'dokumen') {
                            dokumenList = data[f.key] && Array.isArray(data[f.key]) ? data[f.key] : [];
                            renderDokumenPreview();
                        } else if (f.key === 'dokumen_cagar') {
                            dokumenCagarList = data[f.key] && Array.isArray(data[f.key]) ? data[f.key] : [];
                            renderDokumenCagarPreview();

                            gambarManuskripList = data[f.key] && Array.isArray(data[f.key]) ? data[f.key] : [];
                            renderGambarManuskripPreview();
                        } else if (f.key === 'gambar_cagar') {
                            gambarCagarList = data[f.key] && Array.isArray(data[f.key]) ? data[f.key] : [];
                            renderGambarCagarPreview();
                        } else if (f.key === 'gambar_adat') {
                            gambarAdatList = data[f.key] && Array.isArray(data[f.key]) ? data[f.key] : [];
                            renderGambarAdatPreview();

            // ===== EDIT DATA =====
            function editData(menu, index) {
                const data = loadData(menu);
                const item = data[index];
                if (!item) return;
                editIndex = index;
                setFormValues(menu, item);
                btnSubmit.innerHTML = '<i class="fas fa-edit"></i> Update';
                formTitle.innerHTML = '<i class="fas fa-edit"></i> Edit Data';
                btnCancel.style.display = 'inline-flex';
                document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // ===== DELETE DATA =====
            function deleteData(menu, index) {
                let data = loadData(menu);
                data.splice(index, 1);
                saveData(menu, data);
                renderTable(menu);
                if (editIndex === index) resetForm(menu);
            }

            // ===== HANDLE SUBMIT =====
            function handleSubmit(e) {
                e.preventDefault();
                const menu = currentMenu;
                const config = MENU_CONFIG[menu];
                let valid = true;
                config.fields.forEach(f => {
                    if (f.required && f.type !== 'file') {
                        const el = document.getElementById('field_' + f.key);
                        if (el && !el.value.trim()) {
                            valid = false;
                            el.style.borderColor = '#EF5350';
                            setTimeout(() => el.style.borderColor = '', 2000);
                        }
                    }
                });
                if (!valid) { 
                    alert('Harap isi semua field wajib (*).'); 
                    return; 
                }
                const values = getFormValues(menu);
                let data = loadData(menu);
                if (editIndex === -1) data.push(values);
                else { data[editIndex] = values; editIndex = -1; }
                saveData(menu, data);
                renderTable(menu);
                resetForm(menu);
                window.dispatchEvent(new Event('storage'));
            }

            // ===== DELETE ALL DATA =====
            function deleteAllData(menu) {
                if (loadData(menu).length === 0) { alert('Tidak ada data.'); return; }
                if (confirm('Hapus SEMUA data?')) { 
                    saveData(menu, []); 
                    renderTable(menu); 
                    resetForm(menu);
                    window.dispatchEvent(new Event('storage'));
                }
            }

            // ===== SWITCH MENU =====
            function switchMenu(menu) {
                currentMenu = menu;
                const config = MENU_CONFIG[menu];
                pageTitle.textContent = config.label;
                pageSub.textContent = `Kelola data ${config.label.toLowerCase()} di Provinsi Banten`;
                menuItems.forEach(el => el.classList.toggle('active', el.dataset.menu === menu));
                renderForm(menu);
                renderTable(menu);
                resetForm(menu);
            }

            btnCancel.addEventListener('click', function() { resetForm(currentMenu); });
            btnDeleteAll.addEventListener('click', function() { deleteAllData(currentMenu); });

            window.addEventListener('storage', function(e) {
                if (e.key && e.key.startsWith('admin_')) {
                    const menu = e.key.replace('admin_', '');
                    if (menu === currentMenu) renderTable(menu);
                }
            });
